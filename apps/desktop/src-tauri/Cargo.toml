[package]
name = "semantic-calendar"
version = "0.1.0"
description = "Semantic Calendar desktop application"
authors = ["Semantic Calendar contributors"]
edition = "2021"

[lib]
name = "semantic_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
